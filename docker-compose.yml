services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      QUBITKEY_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
      QUBITKEY_ENABLE_PQC: "false"
      QUBITKEY_ENABLE_IBM_QPU: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8000"
    depends_on:
      - backend
