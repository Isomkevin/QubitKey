[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qubitkey-backend"
version = "0.1.0"
description = "QubitKey FastAPI backend — QRNG education and TOTP demo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QubitKey contributors" }]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "qiskit~=2.6.2",
  "qiskit-aer~=0.18.2",
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyotp~=2.10",
  "qrcode[pil]>=8.0",
  "cryptography>=48",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ibm = [
  "qiskit-ibm-runtime~=0.52.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
